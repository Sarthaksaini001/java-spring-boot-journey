<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - TelStore</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">TelStore</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="products.html">Products</a>
            <a class="nav-link" href="plans.html">Plans</a>
            <a class="nav-link" href="cart.html">Cart</a>
            <a class="nav-link active" href="admin.html">Admin</a>
        </div>
    </div>
</nav>

<div class="container my-5">

    <h1 class="mb-4">Admin Dashboard</h1>

    <div id="message"></div>

    <div class="row g-4">

        <!-- Product Form -->
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="mb-3">Add / Update Product</h3>

                    <form id="product-form">
                        <input type="hidden" id="product-id">

                        <input class="form-control mb-3" id="product-name" placeholder="Product name" required>

                        <input class="form-control mb-3" id="product-brand" placeholder="Brand" required>

                        <textarea class="form-control mb-3" id="product-description" placeholder="Description" required></textarea>

                        <input class="form-control mb-3" id="product-price" type="number" step="0.01" placeholder="Price" required>

                        <input class="form-control mb-3" id="product-category" placeholder="Category" required>

                        <input class="form-control mb-3" id="product-image" placeholder="Image URL / filename">

                        <input class="form-control mb-3" id="product-stock" type="number" placeholder="Stock quantity" required>

                        <button class="btn btn-primary w-100" type="submit">Save Product</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Plan Form -->
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="mb-3">Add / Update Plan</h3>

                    <form id="plan-form">
                        <input type="hidden" id="plan-id">

                        <input class="form-control mb-3" id="plan-name" placeholder="Plan name" required>

                        <input class="form-control mb-3" id="plan-type" placeholder="Plan type e.g. Mobile" required>

                        <input class="form-control mb-3" id="plan-price" type="number" step="0.01" placeholder="Monthly price" required>

                        <input class="form-control mb-3" id="plan-data" placeholder="Data limit e.g. 100GB" required>

                        <input class="form-control mb-3" id="plan-calls" placeholder="Calls included" required>

                        <input class="form-control mb-3" id="plan-sms" placeholder="SMS included" required>

                        <textarea class="form-control mb-3" id="plan-description" placeholder="Description" required></textarea>

                        <button class="btn btn-success w-100" type="submit">Save Plan</button>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <hr class="my-5">

    <h2 class="mb-4">Manage Products</h2>
    <div id="admin-product-list" class="row g-3 mb-5"></div>

    <h2 class="mb-4">Manage Plans</h2>
    <div id="admin-plan-list" class="row g-3"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
